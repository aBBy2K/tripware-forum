services:
  mysql:
    image: mysql:8.0
    container_name: tripware_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: tripware
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: tripware_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: tripware_app
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3307"
      REDIS_HOST: redis
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/app/static/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build: .
    container_name: tripware_bot
    restart: unless-stopped
    command: python bot.py
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3307"
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  adminer:
    image: adminer
    container_name: tripware_adminer
    restart: unless-stopped
    profiles: ["debug"]
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  mysql_data:
  uploads: