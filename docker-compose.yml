version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: tripware_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tripware
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: tripware_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
  adminer:
    image: adminer
    container_name: tripware_adminer
    restart: unless-stopped
    ports:
      -  "8080:8080"

volumes:
  mysql_data:
