<!doctype html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="icon" href="/static/assets/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>tripware</title>
</head>
<body>
    <header>
        <div class="software-header-info">
            <a href="/">
                <img src="/static/assets/favicon.png" width="30px" height="30px">
            </a>
            <a href="/">
                tripware.club
            </a>
        </div>
        <nav>
            <a href="/">Index</a>
            <a href="/buy">Subscription</a>
            <a href="/dms">DMs</a>
            <a href="/profile">Profile</a>
            <a href="/profile/logout">Log out</a>
            <a href="/profile/notifications" class="notif-bell">
                Notifications
                <span id="notif-count" style="display:flex">0</span>
            </a>
        </nav>
    </header>
    <p style="text-align: center">Current online: <span id="cur_online"></span></p>
    <div class="profile-container">
        <form method="get" class="msg-chatbox-container" action="/forum/search">
            <input id="q" name="q" type="text" placeholder="Search...">
            <input type="submit" value="Search">
        </form>
    </div>
    {% block content %}
    {% endblock %}

    <script>
    const notifSocket = new WebSocket(`wss://${window.location.host}/profile/notifications/ws`);
    let unreadCount = 0;

    window.addEventListener("pagehide", () => {
    if (notifSocket.readyState === WebSocket.OPEN || notifSocket.readyState === WebSocket.CONNECTING) {
        notifSocket.close(1000, "page navigation");
        }
    });

    function showNotification(head, body) {
        const notification = document.createElement("div");

        notification.style.position = "fixed";
        notification.style.right = "20px";
        notification.style.bottom = "20px";
        notification.style.width = "320px";
        notification.style.padding = "15px";
        notification.style.background = "#1b1b1b";
        notification.style.border = "1px solid #323232";
        notification.style.borderRadius = "6px";
        notification.style.color = "#fff";
        notification.style.zIndex = "9999";
        notification.style.boxShadow = "0 4px 12px rgba(0, 0, 0, 0.4)";

        notification.innerHTML = `
            <h1 style="font-size: 18px; margin: 0 0 8px 0;">
                ${head}
            </h1>

            <p style="margin: 0 0 8px 0;">
                ${body}
            </p>

            <p style="margin: 0; font-size: 13px;">
                Just now |
                <a href="/profile/notifications" style="color: inherit;">
                    Notifications
                </a>
            </p>
        `;

        document.body.appendChild(notification);

        setTimeout(() => {
            notification.remove();
        }, 5000);
    }

    notifSocket.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === "notification") {
            unreadCount++;

            const badge = document.getElementById("notif-count");
            badge.textContent = unreadCount;
            badge.style.display = "inline";

            showNotification(data.head, data.body);
        }

        else if (data.type === "current_online") {
            const onlineCounter = document.getElementById("cur_online");

            onlineCounter.textContent = data.value;
        }
    };
</script>
</body>
</html>
